[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexloop-eios-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "argon2-cffi>=25,<26",
    "pydantic>=2.12,<3",
    "jsonschema>=4,<5",
    "rfc3339-validator>=0.1,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
nexloop-api = "nexloop_eios.http_api:main"
nexloop-compose-bootstrap = "nexloop_eios.compose_bootstrap:main"
nexloop-doctor = "nexloop_eios.doctor:main"
nexloop-artifact-smoke = "nexloop_eios.artifact_smoke:main"
nexloop-core-sandbox = "nexloop_eios.core_sandbox:main"
nexloop-runtime-worker = "nexloop_eios.runtime_worker:main"
nexloop-effect-worker = "nexloop_eios.effect_worker:main"
nexloop-outbound-recorder = "nexloop_eios.outbound_messages:main"
nexloop-claim-extraction-scheduler = "nexloop_eios.background_services:claim_extraction_scheduler"
nexloop-claim-extraction-worker = "nexloop_eios.background_services:claim_extraction_worker"
nexloop-claim-matcher = "nexloop_eios.background_services:claim_matcher"
nexloop-plan-reevaluator = "nexloop_eios.background_services:plan_reevaluator"
nexloop-recall-indexer = "nexloop_eios.background_services:recall_indexer"

[tool.hatch.build.targets.wheel]
packages = ["src/eios", "src/nexloop_eios"]

[tool.hatch.build.targets.wheel.force-include]
"PROVENANCE.json" = "eios/PROVENANCE.json"
