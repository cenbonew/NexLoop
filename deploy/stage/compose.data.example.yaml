# NX-032 slice 0: DATA_HOST stage Compose (PostgreSQL 18 + Valkey). Example only: every value comes from the private compose
# env file (deploy/stage/compose.data.env.example lists the variables); configuration files are rendered first by
# scripts/deploy/render.py. No network is shared with APP_HOST; only two ports are published, on DATA_HOST_ADDR only.
name: nexloop-data
services:
  postgres:
    # nexloop/postgres of the signed release (PostgreSQL 18 + pgvector + pgBackRest; the image runs as postgres, uid 999):
    # the data directory, the socket directory and the files mounted below must be owned by or readable to uid 999.
    image: ${POSTGRES_IMAGE:?nexloop/postgres of the signed release, by digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXLOOP_DB:?database name}
      POSTGRES_USER: nexloop_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap_password
      PGDATA: /var/lib/postgresql/18/docker
      # NX-035: pgBackRest (archive_command and `docker exec -u postgres ... pgbackrest`) connects over the local socket with
      # the SCRAM passwords of this private file (0600, uid 999); never a password on a command line.
      PGPASSFILE: /etc/pgbackrest/pgpass
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    ports:
      - "${DATA_HOST_ADDR:?DATA_HOST address}:${PG_PORT:?PostgreSQL port}:5432"
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/postgres:/var/lib/postgresql
      - ${NEXLOOP_ROOT:?root}/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${NEXLOOP_ROOT:?root}/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${NEXLOOP_ROOT:?root}/secrets/postgres/server.crt:/run/tls/server.crt:ro
      - ${NEXLOOP_ROOT:?root}/secrets/postgres/server.key:/run/tls/server.key:ro
      - ${NEXLOOP_ROOT:?root}/secrets/postgres/ca.crt:/run/tls/ca.crt:ro
      # NX-035: pgBackRest configuration (repository passphrases, object-store keys) and its pgpass, private, uid 999, 0600.
      - ${NEXLOOP_ROOT:?root}/secrets/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ${NEXLOOP_ROOT:?root}/secrets/pgbackrest/pgpass:/etc/pgbackrest/pgpass:ro
      # NX-035 M8: pgBackRest is a TLS client of the repo1 server on APP_HOST (pgbackrest.conf repo1-host-*-file); the client
      # certificate's CN is pgbackrest-data-client (tls-server-auth of pgbackrest-server.conf), private, uid 999.
      - ${NEXLOOP_ROOT:?root}/secrets/pgbackrest/client.crt:/etc/pgbackrest/tls/client.crt:ro
      - ${NEXLOOP_ROOT:?root}/secrets/pgbackrest/client.key:/etc/pgbackrest/tls/client.key:ro
      - ${NEXLOOP_ROOT:?root}/secrets/pgbackrest/ca.crt:/etc/pgbackrest/tls/ca.crt:ro
      # NX-035 design §4.1: the backup roles connect only over this host-local socket directory (0700, uid 999; the
      # nexloop-backup executor on DATA_HOST uses host=$NEXLOOP_ROOT/run/postgresql in its private DSN files).
      - ${NEXLOOP_ROOT:?root}/run/postgresql:/var/run/postgresql
    secrets: [pg_bootstrap_password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexloop_bootstrap -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    labels:
      nexloop.component: postgres
  valkey:
    image: ${VALKEY_IMAGE:?audited TLS-capable Valkey image by digest}
    restart: unless-stopped
    command: [valkey-server, /etc/valkey/valkey.conf]
    ports:
      - "${DATA_HOST_ADDR:?DATA_HOST address}:${VALKEY_PORT:?Valkey TLS port}:6379"
    volumes:
      - ${NEXLOOP_ROOT:?root}/config/valkey.conf:/etc/valkey/valkey.conf:ro
      - ${NEXLOOP_ROOT:?root}/secrets/valkey/valkey.acl:/run/secrets/valkey.acl:ro
      - ${NEXLOOP_ROOT:?root}/secrets/valkey/server.crt:/run/tls/server.crt:ro
      - ${NEXLOOP_ROOT:?root}/secrets/valkey/server.key:/run/tls/server.key:ro
      - ${NEXLOOP_ROOT:?root}/secrets/valkey/ca.crt:/run/tls/ca.crt:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      nexloop.component: valkey
secrets:
  pg_bootstrap_password:
    file: ${NEXLOOP_ROOT:?root}/secrets/postgres/bootstrap_password
