# NX-041 S6 (design §6, D3, D4, D6): the simulation process group - its own compose project on APP_HOST, off by default.
# Every service carries the profile `simulation`; nothing starts unless the project is brought up with `--profile simulation`.
# It shares no network namespace with the real project (nexloop-app): its own bridge network, and the runtime worker, the stand-in
# executor and the file purger share the simulation Agent Host's namespace (loopback only between them).
# Example only: every path, image, port and world comes from the private env file; nothing here is a real address.
# What this group never holds: a real or test service credential, a channel or provider secret, a provider/routes configuration,
# the real Host's model key or runtime root. Its secrets are the simulation world's own (S2 D10: worlds exactly that one world),
# the simulation model account (D6: monthly cap 100 CNY, also enforced in the database) and its own Host transport material.
name: nexloop-simulation
x-sim-service: &sim-service
  image: ${NEXLOOP_BACKEND_IMAGE:?tested backend image digest required}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: on-failure
  profiles: [simulation]
  user: '${NEXLOOP_SIM_UID:?simulation service uid required}:${NEXLOOP_SIM_GID:?simulation service gid required}'
  labels:
    nexloop.budget-service: none
services:
  sim-agent-host:
    image: ${AGENT_HOST_IMAGE:?Agent Host image by digest}
    profiles: [simulation]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [simulation]
    user: '${NEXLOOP_SIM_UID:?simulation service uid required}:${NEXLOOP_SIM_GID:?simulation service gid required}'
    # Its own runtime root: one directory per simulation world (removed as a whole when the world is deleted).
    volumes: ['${NEXLOOP_SIM_RUNTIME_DIR:?private simulation runtime directory required}:/private/runtime']
    # The runtime configuration sets "world_group": "simulation": this Host refuses every real and test Run command.
    command: [--node, /usr/local/bin/node, --runtime-root, /private/runtime, --internal-key-file, /run/secrets/sim_host_transport_key,
              --port, '${NEXLOOP_SIM_HOST_PORT:?simulation Host port}', --tls-certificate-file, /run/secrets/sim_host_cert,
              --tls-key-file, /run/secrets/sim_host_key, --runtime-config-file, /run/secrets/sim_host_runtime_config]
    secrets: [sim_host_cert, sim_host_key, sim_host_transport_key, sim_guard_ca, sim_host_guard_key, sim_host_runtime_config,
              sim_host_model_configuration]
    labels:
      nexloop.budget-service: none
  sim-runtime-worker:
    <<: *sim-service
    network_mode: service:sim-agent-host
    entrypoint: [nexloop-runtime-worker]
    command:
      - --database-url-file
      - /run/secrets/sim_runtime_worker_dsn
      - --signing-key-file
      - /run/secrets/sim_signing_key
      - --signing-key-id
      - ${NEXLOOP_SIM_SIGNING_KEY_ID:?simulation signing key id required}
      - --service-credential-file
      - /run/secrets/sim_world_credential
      - --artifact-root
      - /var/lib/nexloop/artifacts
      - --world
      - ${NEXLOOP_SIM_WORLD:?sim:<uuid> or shadow:<uuid> required}
      - --world-group
      - simulation
      - --queue
      - operations
      - --host-origin
      - https://127.0.0.1:${NEXLOOP_SIM_HOST_PORT:?simulation Host port}
      - --host-control-key-file
      - /run/secrets/sim_host_transport_key
      - --host-ca-file
      - /run/secrets/sim_host_ca
      - --guard-port
      - ${NEXLOOP_SIM_GUARD_PORT:?simulation guard port}
      - --guard-key-file
      - /run/secrets/sim_host_guard_key
      - --guard-certificate-file
      - /run/secrets/sim_guard_certificate
      - --guard-tls-key-file
      - /run/secrets/sim_guard_tls_key
    secrets: [sim_runtime_worker_dsn, sim_signing_key, sim_world_credential, sim_host_transport_key, sim_host_ca, sim_host_guard_key,
              sim_guard_certificate, sim_guard_tls_key]
    volumes: ['${NEXLOOP_SIM_ARTIFACT_DIR:?private simulation artifact directory required}:/var/lib/nexloop/artifacts']
  sim-stand-in-executor:
    # D4: database URL, the world's credential and the world - no provider, routes, channel or network client.
    <<: *sim-service
    network_mode: service:sim-agent-host
    entrypoint: [python, -m, nexloop_eios.stand_in_executor]
    command: [--database-url-file, /run/secrets/sim_stand_in_dsn, --service-credential-file, /run/secrets/sim_world_credential,
              --world, '${NEXLOOP_SIM_WORLD:?sim:<uuid> or shadow:<uuid> required}']
    secrets: [sim_stand_in_dsn, sim_world_credential]
  sim-world-files:
    # S2/S6: removes a deleted world's directory on the simulation Host (no world credential; the world's own is revoked).
    <<: *sim-service
    network_mode: service:sim-agent-host
    entrypoint: [python, -m, nexloop_eios.sim_world_files]
    command: [--database-url-file, /run/secrets/sim_world_files_dsn, --host-port, '${NEXLOOP_SIM_HOST_PORT:?simulation Host port}',
              --host-control-key-file, /run/secrets/sim_host_transport_key, --host-ca-file, /run/secrets/sim_host_ca]
    secrets: [sim_world_files_dsn, sim_host_transport_key, sim_host_ca]
networks:
  simulation:
    name: nexloop-simulation
    # Egress is limited by the host firewall to the database port (D4); no provider or channel endpoint is reachable.
    driver: bridge
secrets:
  sim_host_cert: {file: '${NEXLOOP_SIM_SECRET_DIR:?private simulation secret directory required}/sim_host_cert'}
  sim_host_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_key'}
  sim_host_ca: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_ca'}
  sim_host_transport_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_transport_key'}
  sim_guard_ca: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_ca'}
  sim_host_guard_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_guard_key'}
  sim_guard_certificate: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_certificate'}
  sim_guard_tls_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_tls_key'}
  sim_host_runtime_config: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_runtime_config'}
  sim_host_model_configuration: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_model_configuration'}
  sim_runtime_worker_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_runtime_worker_dsn'}
  sim_signing_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_signing_key'}
  sim_world_credential: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_world_credential'}
  sim_stand_in_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_stand_in_dsn'}
  sim_world_files_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_world_files_dsn'}
