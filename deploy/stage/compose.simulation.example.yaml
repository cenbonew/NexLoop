# NX-041 S6 (design §6, D3, D4, D6): the simulation process group - its own compose project on APP_HOST, off by default.
# Every service carries the profile `simulation`; nothing starts unless the project is brought up with `--profile simulation`.
# It shares no network namespace with the real project (nexloop-app): its own bridge network on a fixed subnet
# (NEXLOOP_SIM_SUBNET), and the runtime worker, the stand-in executor and the file purger share the simulation Agent Host's
# namespace (loopback only between them).
# Egress (review 1.3): the group needs exactly two destinations - DATA_HOST's PostgreSQL (workers) and the model provider
# allowlist on 443 (the simulation Host; D6: a deterministic or cheap model). Compose cannot allow by domain, so the boundary is
# the host firewall: docs/implementation/NX-041-S6-simulation.nft.example (table inet nexloop_simulation) admits those two from
# NEXLOOP_SIM_SUBNET and drops every other new connection, including APP_HOST's own ports (the real Host, guard and gateway).
# It is applied by the owner; the deployment sheet then probes a real Host port from a simulation container and expects a refusal.
# Database roles (review 1.2, S6c): every process connects as a simulation role of its own, none a member of a real role - the
# runtime worker's dispatcher as nexloop_sim_worker, its guard children as nexloop_sim_guard, the stand-in executor as
# nexloop_stand_in_worker, the file purger as nexloop_sim_files (nexloop_sim_api is for the simulation world's event intake, not
# part of this project yet). Each DSN file is that role's own; the secret directory holds no real role's password.
# Example only: every path, image, port and world comes from the private env file; nothing here is a real address.
# What this group never holds: a real or test service credential, a channel or provider secret, a provider/routes configuration,
# the real Host's model key or runtime root. Its secrets are the simulation world's own (S2 D10: worlds exactly that one world),
# the simulation model account (D6: monthly cap 100 CNY, also enforced in the database) and its own Host transport material.
name: nexloop-simulation
x-sim-service: &sim-service
  image: ${NEXLOOP_BACKEND_IMAGE:?tested backend image digest required}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: on-failure
  profiles: [simulation]
  user: '${NEXLOOP_SIM_UID:?simulation service uid required}:${NEXLOOP_SIM_GID:?simulation service gid required}'
  labels:
    nexloop.budget-service: none
services:
  sim-agent-host:
    image: ${AGENT_HOST_IMAGE:?Agent Host image by digest}
    profiles: [simulation]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [simulation]
    user: '${NEXLOOP_SIM_UID:?simulation service uid required}:${NEXLOOP_SIM_GID:?simulation service gid required}'
    # Its own runtime root: one directory per simulation world (removed as a whole when the world is deleted).
    volumes: ['${NEXLOOP_SIM_RUNTIME_DIR:?private simulation runtime directory required}:/private/runtime']
    # The runtime configuration sets "world_group": "simulation": this Host refuses every real and test Run command.
    command: [--node, /usr/local/bin/node, --runtime-root, /private/runtime, --internal-key-file, /run/secrets/sim_host_transport_key,
              --port, '${NEXLOOP_SIM_HOST_PORT:?simulation Host port}', --tls-certificate-file, /run/secrets/sim_host_cert,
              --tls-key-file, /run/secrets/sim_host_key, --runtime-config-file, /run/secrets/sim_host_runtime_config]
    # The runtime configuration also names host_id (NEXLOOP_SIM_HOST_ID, registered in authz.nexloop_sim_hosts) and
    # world_purge_key_file (/run/secrets/sim_host_purge_key: the Host's purge key, held by this service and the database only).
    secrets: [sim_host_cert, sim_host_key, sim_host_transport_key, sim_guard_ca, sim_host_guard_key, sim_host_runtime_config,
              sim_host_model_configuration, sim_host_purge_key]
    # Liveness on the loopback (stage finding 2026-10-22): the services sharing this network namespace start only once the Host is
    # healthy, and restart with it. Certificate verification is off for this probe only: it sends nothing and reads a status code.
    healthcheck:
      test: [CMD, /usr/local/bin/node, -e, "const r=require('https').get({host:'127.0.0.1',port:Number(process.argv[1]),path:'/health/live',rejectUnauthorized:false,timeout:3000},s=>process.exit(s.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.on('timeout',()=>process.exit(1))", '${NEXLOOP_SIM_HOST_PORT}']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      nexloop.budget-service: none
  sim-runtime-worker:
    <<: *sim-service
    network_mode: service:sim-agent-host
    # The shared namespace is the Host's: start once it is healthy and restart with it (a dependent started during a Host restart
    # loop kept a broken namespace - Network is unreachable - until force-recreated; stage finding 2026-10-22).
    depends_on:
      sim-agent-host: {condition: service_healthy, restart: true}
    entrypoint: [nexloop-runtime-worker]
    command:
      - --database-url-file
      - /run/secrets/sim_worker_dsn
      - --signing-key-file
      - /run/secrets/sim_signing_key
      - --signing-key-id
      - ${NEXLOOP_SIM_SIGNING_KEY_ID:?simulation signing key id required}
      - --service-credential-file
      - /run/secrets/sim_world_credential
      - --artifact-root
      - /var/lib/nexloop/artifacts
      - --world
      - ${NEXLOOP_SIM_WORLD:?sim:<uuid> or shadow:<uuid> required}
      - --world-group
      - simulation
      - --queue
      - operations
      - --host-origin
      - https://127.0.0.1:${NEXLOOP_SIM_HOST_PORT:?simulation Host port}
      - --host-control-key-file
      - /run/secrets/sim_host_transport_key
      - --host-ca-file
      - /run/secrets/sim_host_ca
      - --guard-port
      - ${NEXLOOP_SIM_GUARD_PORT:?simulation guard port}
      - --guard-key-file
      - /run/secrets/sim_host_guard_key
      - --guard-certificate-file
      - /run/secrets/sim_guard_certificate
      - --guard-tls-key-file
      - /run/secrets/sim_guard_tls_key
      # S6c: the guard serves from child processes connected as nexloop_sim_guard (its own DSN), never as the dispatcher's role.
      - --guard-database-url-file
      - /run/secrets/sim_guard_dsn
      - --guard-workers
      - '2'
    secrets: [sim_pg_ca, sim_worker_dsn, sim_guard_dsn, sim_signing_key, sim_world_credential, sim_host_transport_key, sim_host_ca, sim_host_guard_key,
              sim_guard_certificate, sim_guard_tls_key]
    volumes: ['${NEXLOOP_SIM_ARTIFACT_DIR:?private simulation artifact directory required}:/var/lib/nexloop/artifacts']
  sim-stand-in-executor:
    # D4: database URL, the world's credential and the world - no provider, routes, channel or network client.
    <<: *sim-service
    network_mode: service:sim-agent-host
    # The shared namespace is the Host's: start once it is healthy and restart with it (a dependent started during a Host restart
    # loop kept a broken namespace - Network is unreachable - until force-recreated; stage finding 2026-10-22).
    depends_on:
      sim-agent-host: {condition: service_healthy, restart: true}
    entrypoint: [python, -m, nexloop_eios.stand_in_executor]
    command: [--database-url-file, /run/secrets/sim_stand_in_worker_dsn, --service-credential-file, /run/secrets/sim_world_credential,
              --world, '${NEXLOOP_SIM_WORLD:?sim:<uuid> or shadow:<uuid> required}']
    secrets: [sim_pg_ca, sim_stand_in_worker_dsn, sim_world_credential]
  sim-world-files:
    # S2/S6: removes a deleted world's directory on the simulation Host with the database's permit and hands back the Host's signed
    # proof (no world credential, no Host key).
    <<: *sim-service
    network_mode: service:sim-agent-host
    # The shared namespace is the Host's: start once it is healthy and restart with it (a dependent started during a Host restart
    # loop kept a broken namespace - Network is unreachable - until force-recreated; stage finding 2026-10-22).
    depends_on:
      sim-agent-host: {condition: service_healthy, restart: true}
    entrypoint: [python, -m, nexloop_eios.sim_world_files]
    command: [--database-url-file, /run/secrets/sim_files_dsn, --host-port, '${NEXLOOP_SIM_HOST_PORT:?simulation Host port}',
              --host-id, '${NEXLOOP_SIM_HOST_ID:?simulation Host id}',
              --host-control-key-file, /run/secrets/sim_host_transport_key, --host-ca-file, /run/secrets/sim_host_ca]
    secrets: [sim_pg_ca, sim_files_dsn, sim_host_transport_key, sim_host_ca]
  # Stage enablement (L6 review B2): the one-off writers of the secret and token files, so the files belong to NEXLOOP_SIM_UID from
  # the start and nobody runs sudo chown. Profile sim-setup only (never started by --profile simulation); run with
  #   docker compose ... --profile sim-setup run --rm sim-setup-dir            (once: the two directories, 0700, owned by the uid)
  #   docker compose ... --profile sim-setup run --rm -T sim-setup <tool> --config /setup/<config>   (passwords on stdin)
  # The tools come read-only from the release checkout; their configurations, the configurator DSN and the signing key from a
  # private read-only input directory; nothing here is kept in the image.
  sim-setup-dir:
    image: ${NEXLOOP_BACKEND_IMAGE:?tested backend image digest required}
    profiles: [sim-setup]
    restart: 'no'
    read_only: true
    network_mode: none
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    # CAP_CHOWN only (no FOWNER): root may chmod only what it owns. So each path is first given to root (chown, allowed), then
    # chmod-ed, then given to the target uid - whoever owned it before (docker's bind mount creates a missing directory 0755 root;
    # the dispatcher's input files are the deploy account's; a rerun finds the target uid's). Dispatcher 2026-10-22 stage finding.
    entrypoint: [python, -c, 'import os,sys;u,g=int(sys.argv[1]),int(sys.argv[2])
      ;[(os.makedirs(d,mode=0o700,exist_ok=True),os.chown(d,0,0),os.chmod(d,0o700),os.chown(d,u,g)) for d in ("/sim-secrets","/sim-tokens","/sim-runtime","/sim-artifacts")]',
                 '${NEXLOOP_SIM_UID:?simulation service uid required}', '${NEXLOOP_SIM_GID:?simulation service gid required}']
    volumes:
      - '${NEXLOOP_SIM_SECRET_DIR:?private simulation secret directory required}:/sim-secrets'
      - '${NEXLOOP_SIM_TOKEN_DIR:?private simulation token directory required}:/sim-tokens'
      # Stage finding 2026-10-22: the Host's runtime root and the worker's artifact root must be the simulation uid's (0700) too.
      - '${NEXLOOP_SIM_RUNTIME_DIR:?private simulation runtime directory required}:/sim-runtime'
      - '${NEXLOOP_SIM_ARTIFACT_DIR:?private simulation artifact directory required}:/sim-artifacts'
  sim-setup:
    image: ${NEXLOOP_BACKEND_IMAGE:?tested backend image digest required}
    profiles: [sim-setup]
    restart: 'no'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '${NEXLOOP_SIM_UID:?simulation service uid required}:${NEXLOOP_SIM_GID:?simulation service gid required}'
    networks: [simulation]
    # Preflight (stage finding 2026-10-22): the release checkout must be readable by this uid - an export with git archive, made
    # go+rX (docs/implementation/sim-stage-enable.md), not the deployment's root-only checkout. The launcher checks it before anything
    # runs (working_dir is / so that an unreadable checkout reaches this check instead of failing docker's chdir), then runs the named
    # script of the checkout (scripts/... only) as __main__.
    working_dir: /
    entrypoint: [python, -c, 'import os,sys,json,runpy;r="/opt/nexloop-release";a=sys.argv[1:];t=os.path.join(r,a[0]) if a else ""
      ;ok=bool(a) and a[0].startswith("scripts/") and ".." not in a[0]
      ;bad=[p for p in ("","scripts","scripts/deploy","scripts/acceptance","packages/eios-core/src") if not os.access(os.path.join(r,p),os.R_OK|os.X_OK)]
      ;ok or sys.exit(print(json.dumps({"ok":False,"detail":"name a script of the release checkout: scripts/..."})) or 2)
      ;(bad or not os.access(t,os.R_OK)) and sys.exit(print(json.dumps({"ok":False,"detail":"the release checkout is not readable by uid %d (%s): mount a git archive export made go+rX, see sim-stage-enable.md" % (os.getuid(),", ".join(p or "." for p in bad) or a[0])})) or 2)
      ;os.chdir(r);sys.argv=[t]+a[1:];sys.path.insert(0,os.path.dirname(t));runpy.run_path(t,run_name="__main__")']
    volumes:
      - '${NEXLOOP_SIM_RELEASE_CHECKOUT:?release checkout required}:/opt/nexloop-release:ro'
      - '${NEXLOOP_SIM_SETUP_INPUT_DIR:?private setup input directory required}:/setup:ro'
      - '${NEXLOOP_SIM_SECRET_DIR}:/sim-secrets'
      - '${NEXLOOP_SIM_TOKEN_DIR}:/sim-tokens'
      # The same secret directory read only where the DSN files point (sslrootcert=/run/secrets/sim_pg_ca), as in the running
      # services: sim_dsn_files.py --check and AT-046's intake connect with the DSN files unchanged (stage finding 2026-10-22).
      - '${NEXLOOP_SIM_SECRET_DIR}:/run/secrets:ro'
networks:
  simulation:
    name: nexloop-simulation
    # The fixed subnet the host firewall template matches (NX-041-S6-simulation.nft.example, __SIM_SUBNET__).
    driver: bridge
    ipam:
      config:
        - subnet: '${NEXLOOP_SIM_SUBNET:?simulation subnet required}'
secrets:
  sim_host_cert: {file: '${NEXLOOP_SIM_SECRET_DIR:?private simulation secret directory required}/sim_host_cert'}
  sim_host_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_key'}
  sim_host_ca: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_ca'}
  sim_host_transport_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_transport_key'}
  sim_guard_ca: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_ca'}
  sim_host_guard_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_guard_key'}
  sim_guard_certificate: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_certificate'}
  sim_guard_tls_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_tls_key'}
  sim_host_runtime_config: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_runtime_config'}
  sim_host_model_configuration: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_model_configuration'}
  # The DATA_HOST PostgreSQL CA (the same bundle as the real group's pg_ca): every simulation DSN verifies the server (verify-full).
  sim_pg_ca: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_pg_ca'}
  sim_worker_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_worker_dsn'}
  sim_guard_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_guard_dsn'}
  sim_signing_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_signing_key'}
  sim_world_credential: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_world_credential'}
  sim_host_purge_key: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_host_purge_key'}
  sim_stand_in_worker_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_stand_in_worker_dsn'}
  sim_files_dsn: {file: '${NEXLOOP_SIM_SECRET_DIR}/sim_files_dsn'}
