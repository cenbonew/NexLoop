# NX-032: APP_HOST stage Compose. Example only: every value comes from the private compose env file (compose.app.env.example lists the
# variables); images are referenced by digest from the release manifest (NX-034); generated from one service table, so commands,
# secrets and budget labels stay consistent.
#
# Two network namespaces (NX-037 D4, owner ruling 2026-10-11). The `app-net` anchor holds the Gateway, the API and every worker on the
# application network (egress: DATA_HOST's PostgreSQL and Valkey only, never a model address); the Agent Host has its own namespace on
# the agent egress network (egress: the model provider allowlist only, never DATA_HOST). The two meet only on `agent_link`, an
# internal network without any route outside, where two loopback relays (nexloop_eios.loopback_relay) carry exactly the two needed
# links with their loopback endpoints unchanged: API/Runtime Worker -> Host control (127.0.0.1:HOST_INTERNAL_PORT) and Host -> guard
# (127.0.0.1:GUARD_PORT). TLS stays end to end between the original peers. Only the Gateway ports are published, on APP_HOST_ADDR. Every service mounts its own secret files one by
# one (never a directory) and nothing else's; the Agent Host gets no DSN, service credential, signing key, channel credential or
# Artifact directory (design §4.2); no service gets a secret through its environment (only REAL_DISPATCH_ENABLED, which starts false, D9).
#
# Each container carries `nexloop.budget-service`: the connection-budget entries (deploy/stage/connection-budget.v1.json) whose pools
# it opens, or "none". `nexloop-doctor --deploy-gate` compares both directions.
name: nexloop-app
x-service: &service
  image: ${BACKEND_IMAGE:?backend image by digest}
  restart: unless-stopped
  network_mode: service:app-net
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &environment
    REAL_DISPATCH_ENABLED: "false"
services:
  app-net:
    # Holds the shared network namespace; the backend image (already in the release) sleeps, so no extra image is needed.
    image: ${BACKEND_IMAGE:?backend image by digest}
    entrypoint: [sleep, infinity]
    restart: unless-stopped
    ports:
      - "${APP_HOST_ADDR:?APP_HOST address}:${GATEWAY_HTTPS_PORT:?Gateway HTTPS port}:8443"
      - "${APP_HOST_ADDR:?APP_HOST address}:${GATEWAY_REDIRECT_PORT:?Gateway redirect port}:8080"
    networks:
      app: {}
      agent_link:
        ipv4_address: ${APP_LINK_ADDR:?application side of the agent link}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      nexloop.budget-service: none
  app-link-relay:
    # Application side: 127.0.0.1:HOST_INTERNAL_PORT -> the Agent Host (over agent_link); the agent link's guard port -> 127.0.0.1 guard.
    <<: *service
    entrypoint: [python, -m, nexloop_eios.loopback_relay]
    command: [--rule, "127.0.0.1:${HOST_INTERNAL_PORT:?Host port}=${AGENT_LINK_ADDR:?Agent Host side of the agent link}:${HOST_INTERNAL_PORT:?Host port}",
              --rule, "${APP_LINK_ADDR:?application side of the agent link}:${GUARD_PORT:?guard port}=127.0.0.1:${GUARD_PORT:?guard port}"]
    labels:
      nexloop.budget-service: none
  gateway:
    <<: *service
    image: ${GATEWAY_IMAGE:?gateway image by digest}
    volumes:
      - ${NEXLOOP_ROOT:?root}/config/Caddyfile:/etc/caddy/Caddyfile:ro
    secrets: [gateway_cert, gateway_key, api_loopback_ca]
    labels:
      nexloop.budget-service: none
  agent-host:
    # Its own namespace: not the shared anchor (same hardening, written out).
    image: ${AGENT_HOST_IMAGE:?Agent Host image by digest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REAL_DISPATCH_ENABLED: "false"
    networks:
      agent_egress: {}
      agent_link:
        ipv4_address: ${AGENT_LINK_ADDR:?Agent Host side of the agent link}
    user: "${AGENT_HOST_UID:?Agent Host UID}:${AGENT_HOST_UID:?Agent Host UID}"
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/runtime:/private/runtime
    secrets: [host_cert, host_key, host_transport_key, guard_ca]
    labels:
      nexloop.budget-service: none
  agent-link-relay:
    # Agent Host side: 127.0.0.1:GUARD_PORT -> the guard (over agent_link); the agent link's Host port -> 127.0.0.1 Host.
    <<: *service
    network_mode: service:agent-host
    entrypoint: [python, -m, nexloop_eios.loopback_relay]
    command: [--rule, "127.0.0.1:${GUARD_PORT:?guard port}=${APP_LINK_ADDR:?application side of the agent link}:${GUARD_PORT:?guard port}",
              --rule, "${AGENT_LINK_ADDR:?Agent Host side of the agent link}:${HOST_INTERNAL_PORT:?Host port}=127.0.0.1:${HOST_INTERNAL_PORT:?Host port}"]
    labels:
      nexloop.budget-service: none
  api-1:
    # ADR-024 / 11 §7: two API processes; each also opens the browser identity pool (budget api-browser-identity, 4 per process).
    <<: *service
    entrypoint: [nexloop-api]
    command: [--mode, stage, --execution-profile, "${API_EXECUTION_PROFILE:?real-provider or disabled}", --database-url-file, /run/secrets/api_dsn,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --host-ca-file, /run/secrets/host_ca, --host-control-key-file, /run/secrets/host_control_key,
              --host-origin, "https://127.0.0.1:${HOST_INTERNAL_PORT:?Host port}", --port, "${API_INTERNAL_PORT:?API port}", --tls-certificate-file,
              /run/secrets/api_loopback_cert, --tls-key-file, /run/secrets/api_loopback_key, --identity-database-url-file, /run/secrets/api_identity_dsn,
              --identity-pool-max, "4", --browser-rate-key-file, /run/secrets/api_browser_rate_key, --browser-tenant-id, "${BROWSER_TENANT_ID:?tenant}",
              --browser-application-id, "${BROWSER_APPLICATION_ID:?application}", --workbench-application-id, "${WORKBENCH_APPLICATION_ID:?workbench application}",
              --browser-origin, "${BROWSER_ORIGIN:?https origin}", --web-root, /opt/nexloop/web]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [api_dsn, api_pg_client_cert, api_pg_client_key, api_identity_dsn, api_browser_rate_key, signing_key, pg_ca, host_ca, host_control_key, api_loopback_cert, api_loopback_key]
    labels:
      nexloop.budget-service: "api,api-browser-identity"
  api-2:
    # ADR-024 / 11 §7: two API processes; each also opens the browser identity pool (budget api-browser-identity, 4 per process).
    <<: *service
    entrypoint: [nexloop-api]
    command: [--mode, stage, --execution-profile, "${API_EXECUTION_PROFILE:?real-provider or disabled}", --database-url-file, /run/secrets/api_dsn,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --host-ca-file, /run/secrets/host_ca, --host-control-key-file, /run/secrets/host_control_key,
              --host-origin, "https://127.0.0.1:${HOST_INTERNAL_PORT:?Host port}", --port, "${API_INTERNAL_PORT_2:?second API port}",
              --tls-certificate-file, /run/secrets/api_loopback_cert, --tls-key-file, /run/secrets/api_loopback_key, --identity-database-url-file,
              /run/secrets/api_identity_dsn, --identity-pool-max, "4", --browser-rate-key-file, /run/secrets/api_browser_rate_key,
              --browser-tenant-id, "${BROWSER_TENANT_ID:?tenant}", --browser-application-id, "${BROWSER_APPLICATION_ID:?application}",
              --workbench-application-id, "${WORKBENCH_APPLICATION_ID:?workbench application}", --browser-origin, "${BROWSER_ORIGIN:?https origin}",
              --web-root, /opt/nexloop/web]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [api_dsn, api_pg_client_cert, api_pg_client_key, api_identity_dsn, api_browser_rate_key, signing_key, pg_ca, host_ca, host_control_key, api_loopback_cert, api_loopback_key]
    labels:
      nexloop.budget-service: "api,api-browser-identity"
  domain-worker:
    # One bounded page of Artifact maintenance per run, every 5 minutes (python -m nexloop_eios.domain_worker).
    <<: *service
    entrypoint: [sh, -c]
    command: ["while true; do python -m nexloop_eios.domain_worker --database-url-file /run/secrets/domain_worker_dsn --service-credential-file /run/secrets/domain_worker_credential --signing-key-file /run/secrets/signing_key --signing-key-id ${SIGNING_KEY_ID:?signing key id} --artifact-root /var/lib/nexloop/artifacts --world real; sleep 300; done"]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [domain_worker_dsn, domain_worker_pg_client_cert, domain_worker_pg_client_key, domain_worker_credential, signing_key, pg_ca]
    labels:
      nexloop.budget-service: domain-worker
  action-worker:
    # The only holder of external channel credentials. NX-037: its own namespace on `effect_egress` (the application namespace
    # never reaches the enterprise endpoint), one provider per Action from the routes file (nexloop.service.request -> the
    # NexLoop delivery service below on loopback, nexloop.enterprise.deliver -> the enterprise HTTPS endpoint); an Action without
    # a route is never dispatched. Firewall: this namespace reaches DATA_HOST's PostgreSQL and the enterprise endpoint only.
    image: ${BACKEND_IMAGE:?backend image by digest}
    restart: unless-stopped
    networks: [effect_egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: *environment
    entrypoint: [nexloop-effect-worker]
    command: [--database-url-file, /run/secrets/action_worker_dsn, --service-credential-file, /run/secrets/action_worker_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real, --provider-routes-file, /run/secrets/action_worker_provider_routes]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [action_worker_dsn, action_worker_pg_client_cert, action_worker_pg_client_key, action_worker_credential, signing_key, pg_ca,
              action_worker_provider_routes, action_worker_webchat_provider, action_worker_webchat_provider_credential, action_worker_webchat_provider_ca,
              action_worker_enterprise_provider, action_worker_enterprise_provider_credential, action_worker_enterprise_provider_ca]
    labels:
      nexloop.budget-service: action-worker
  webchat-delivery:
    # NX-037: the NexLoop delivery service of nexloop.service.request (nexloop_eios.local_json_delivery, HttpEffectProvider
    # protocol: POST /v1/effects, GET /v1/effects/<intent>). Shares the action worker's namespace and listens on its loopback only
    # (WEBCHAT_DELIVERY_PORT); it authenticates as the same executor principal (0051) from its own copy of the credential.
    image: ${BACKEND_IMAGE:?backend image by digest}
    restart: unless-stopped
    network_mode: service:action-worker
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: *environment
    entrypoint: [python, -m, nexloop_eios.local_json_delivery]
    command: [--database-url-file, /run/secrets/webchat_delivery_dsn, --service-credential-file, /run/secrets/webchat_delivery_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --delivery-root, /var/lib/nexloop/webchat-delivery,
              --origin, "https://127.0.0.1:${WEBCHAT_DELIVERY_PORT:?delivery service loopback port}",
              --certificate-file, /run/secrets/webchat_delivery_cert, --tls-key-file, /run/secrets/webchat_delivery_key,
              --provider-ca-file, /run/secrets/webchat_delivery_cert, --provider-credential-file, /run/secrets/webchat_delivery_provider_credential,
              --pool-max, "2"]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
      - ${NEXLOOP_ROOT:?root}/data/webchat-delivery:/var/lib/nexloop/webchat-delivery
    secrets: [webchat_delivery_dsn, webchat_delivery_pg_client_cert, webchat_delivery_pg_client_key, webchat_delivery_credential, signing_key, pg_ca,
              webchat_delivery_cert, webchat_delivery_key, webchat_delivery_provider_credential]
    labels:
      nexloop.budget-service: webchat-delivery
  runtime-worker:
    # ADR-024: 4 guard processes, dispatcher pool 2; NX-031 dispatch loops 4 (= Agent Host maximum_active_runs).
    <<: *service
    entrypoint: [nexloop-runtime-worker]
    command: [--database-url-file, /run/secrets/runtime_worker_dsn, --service-credential-file, /run/secrets/runtime_worker_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --host-control-key-file, /run/secrets/host_control_key, --host-ca-file, /run/secrets/host_ca,
              --guard-key-file, /run/secrets/guard_transport_key, --guard-certificate-file, /run/secrets/guard_cert, --guard-tls-key-file,
              /run/secrets/guard_key, --guard-workers, "4", --dispatcher-pool-max, "2", --dispatch-loops, "4", --guard-port, "${GUARD_PORT:?guard port}",
              --host-origin, "https://127.0.0.1:${HOST_INTERNAL_PORT:?Host port}", --world, real, --queue, runtime]
    environment:
      <<: *environment
      NEX_EIOS_DB_POOL_MAX: "4"
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [runtime_worker_dsn, runtime_worker_pg_client_cert, runtime_worker_pg_client_key, runtime_worker_credential, signing_key, pg_ca, guard_transport_key, guard_cert, guard_key, host_control_key, host_ca]
    labels:
      nexloop.budget-service: runtime-worker
  message-relay:
    # Relay multi-consumer (run profile mode): one process, pool 2. Its Context is v6 (the Host's context_input_protocol).
    <<: *service
    entrypoint: [python, -m, nexloop_eios.message_relay_cli]
    command: [--database-url-file, /run/secrets/message_relay_dsn, --signing-key-file, /run/secrets/signing_key, --signing-key-id,
              "${SIGNING_KEY_ID:?signing key id}", --artifact-root, /var/lib/nexloop/artifacts, --route-credential-file, /run/secrets/message_relay_route_credential,
              --source-credential-file, /run/secrets/message_relay_source_credential, --planner-credential-file, /run/secrets/message_relay_planner_credential,
              --executor-credential-file, /run/secrets/message_relay_executor_credential, --vault-root, /var/lib/nexloop/relay-vault,
              --run-profile-file, /etc/nexloop/relay-run-profile.json, --context-strategy, recent_plus_required]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
      - ${NEXLOOP_ROOT:?root}/data/relay-vault:/var/lib/nexloop/relay-vault
      - ${NEXLOOP_ROOT:?root}/config/relay-run-profile.json:/etc/nexloop/relay-run-profile.json:ro
    secrets: [message_relay_dsn, message_relay_pg_client_cert, message_relay_pg_client_key, message_relay_route_credential, message_relay_source_credential, message_relay_planner_credential, message_relay_executor_credential, signing_key, pg_ca]
    labels:
      nexloop.budget-service: message-relay
  outbound-recorder:
    <<: *service
    entrypoint: [nexloop-outbound-recorder]
    command: [--database-url-file, /run/secrets/outbound_recorder_dsn, --service-credential-file, /run/secrets/outbound_recorder_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [outbound_recorder_dsn, outbound_recorder_pg_client_cert, outbound_recorder_pg_client_key, outbound_recorder_credential, signing_key, pg_ca]
    labels:
      nexloop.budget-service: outbound-recorder
  claim-extraction-scheduler:
    <<: *service
    entrypoint: [nexloop-claim-extraction-scheduler]
    command: [--database-url-file, /run/secrets/claim_extraction_scheduler_dsn, --service-credential-file, /run/secrets/claim_extraction_scheduler_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [claim_extraction_scheduler_dsn, claim_extraction_scheduler_pg_client_cert, claim_extraction_scheduler_pg_client_key, claim_extraction_scheduler_credential, signing_key, pg_ca]
    labels:
      nexloop.budget-service: claim-extraction-scheduler
  claim-extraction-worker:
    # Model credentials only here and in claim-matcher (as files).
    <<: *service
    entrypoint: [nexloop-claim-extraction-worker]
    command: [--database-url-file, /run/secrets/claim_extraction_worker_dsn, --service-credential-file, /run/secrets/claim_extraction_worker_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real, --model-env-file, /run/secrets/claim_extraction_worker_model, --mode,
              stage]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
    secrets: [claim_extraction_worker_dsn, claim_extraction_worker_pg_client_cert, claim_extraction_worker_pg_client_key, claim_extraction_worker_credential, signing_key, pg_ca, claim_extraction_worker_model]
    labels:
      nexloop.budget-service: claim-extraction-worker
  claim-matcher:
    <<: *service
    entrypoint: [nexloop-claim-matcher]
    command: [--database-url-file, /run/secrets/claim_matcher_dsn, --service-credential-file, /run/secrets/claim_matcher_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real, --model-env-file, /run/secrets/claim_matcher_model, --match-config-file,
              /etc/nexloop/claim-match.json]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
      - ${NEXLOOP_ROOT:?root}/config/claim-match.json:/etc/nexloop/claim-match.json:ro
    secrets: [claim_matcher_dsn, claim_matcher_pg_client_cert, claim_matcher_pg_client_key, claim_matcher_credential, signing_key, pg_ca, claim_matcher_model]
    labels:
      nexloop.budget-service: claim-matcher
  recall-indexer:
    <<: *service
    entrypoint: [nexloop-recall-indexer]
    command: [--database-url-file, /run/secrets/recall_indexer_dsn, --service-credential-file, /run/secrets/recall_indexer_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real, --types-file, /etc/nexloop/recall-types.json]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
      - ${NEXLOOP_ROOT:?root}/config/recall-types.json:/etc/nexloop/recall-types.json:ro
    secrets: [recall_indexer_dsn, recall_indexer_pg_client_cert, recall_indexer_pg_client_key, recall_indexer_credential, signing_key, pg_ca]
    labels:
      nexloop.budget-service: recall-indexer
  plan-reevaluator:
    # Its Role launcher pool (nexloop_api, 2) is budget entry plan-reevaluator-launcher.
    <<: *service
    entrypoint: [nexloop-plan-reevaluator]
    command: [--database-url-file, /run/secrets/plan_reevaluator_dsn, --service-credential-file, /run/secrets/plan_reevaluator_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real, --settings-file, /etc/nexloop/plan-reevaluation.json, --api-database-url-file,
              /run/secrets/plan_reevaluator_api_dsn, --source-credential-file, /run/secrets/plan_reevaluator_source_credential,
              --planner-credential-file, /run/secrets/plan_reevaluator_planner_credential, --queue-credential-file, /run/secrets/plan_reevaluator_queue_credential,
              --executor-credential-file, /run/secrets/plan_reevaluator_executor_credential, --effect-action, "eios:action:nexloop.service.request:1"]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
      - ${NEXLOOP_ROOT:?root}/config/plan-reevaluation.json:/etc/nexloop/plan-reevaluation.json:ro
    secrets: [plan_reevaluator_dsn, plan_reevaluator_pg_client_cert, plan_reevaluator_pg_client_key, plan_reevaluator_credential, signing_key, pg_ca, plan_reevaluator_api_dsn, plan_reevaluator_source_credential, plan_reevaluator_planner_credential, plan_reevaluator_queue_credential, plan_reevaluator_executor_credential]
    labels:
      nexloop.budget-service: "plan-reevaluator,plan-reevaluator-launcher"
  reply-guarantor:
    # Its fallback launcher pool (nexloop_api, 2) is budget entry reply-guarantor-launcher.
    <<: *service
    entrypoint: [nexloop-reply-guarantor]
    command: [--database-url-file, /run/secrets/reply_guarantor_dsn, --service-credential-file, /run/secrets/reply_guarantor_credential,
              --signing-key-file, /run/secrets/signing_key, --signing-key-id, "${SIGNING_KEY_ID:?signing key id}", --artifact-root,
              /var/lib/nexloop/artifacts, --world, real, --policy-file, /etc/nexloop/reply-guarantee.json, --api-database-url-file,
              /run/secrets/reply_guarantor_api_dsn, --route-credential-file, /run/secrets/reply_guarantor_route_credential, --source-credential-file,
              /run/secrets/reply_guarantor_source_credential, --planner-credential-file, /run/secrets/reply_guarantor_planner_credential,
              --executor-credential-file, /run/secrets/reply_guarantor_executor_credential, --run-profile-file, /etc/nexloop/relay-run-profile.json]
    volumes:
      - ${NEXLOOP_ROOT:?root}/data/artifacts:/var/lib/nexloop/artifacts
      - ${NEXLOOP_ROOT:?root}/config/reply-guarantee.json:/etc/nexloop/reply-guarantee.json:ro
      - ${NEXLOOP_ROOT:?root}/config/relay-run-profile.json:/etc/nexloop/relay-run-profile.json:ro
