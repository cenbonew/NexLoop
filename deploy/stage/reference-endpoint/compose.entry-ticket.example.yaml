# S81 / ADR-043 (stage only, optional): the reference endpoint accepts NexLoop's staff entry tickets (POST /staff/entry, read-only staff
# session). Add this file after compose.example.yaml (`-f compose.example.yaml -f compose.entry-ticket.example.yaml`); without it the
# route answers 404. entry_ticket_key holds the same 64 hex characters as NexLoop's api/entry-ticket.key (stage_secrets.py
# entry-ticket-key), owned by 10002, mode 0600.
services:
  endpoint:
    environment:
      ENDPOINT_ENTRY_TICKET_KEY_FILE: /run/secrets/entry_ticket_key
    secrets: [endpoint_cert, endpoint_key, service_token, staff_token, entry_ticket_key]
secrets:
  entry_ticket_key: {file: "${ENDPOINT_SECRETS_DIR:?private secrets dir}/entry_ticket_key"}
